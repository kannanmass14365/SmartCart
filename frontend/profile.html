<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account | SmartCart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <h1 class="logo">🛒 Smart<span>Cart</span></h1>
    <button onclick="window.location.href='index.html'">
        🏠 Home
    </button>
</header>

<main class="profile-page">

    <h2>My Account</h2>
    <p class="profile-subtitle">Manage your SmartCart account</p>

    <section class="profile-section">
        <h3>Profile Settings</h3>

        <button class="profile-menu" onclick="editProfile()">
            <span>👤</span>
            <span>Edit Profile<small>Change your name and phone details</small></span>
            <span class="arrow">›</span>
        </button>

        <button class="profile-menu" onclick="manageAddresses()">
            <span>📍</span>
            <span>Saved Addresses<small>Manage delivery addresses</small></span>
            <span class="arrow">›</span>
        </button>
    </section>

    <section class="profile-section">
        <h3>My Shopping</h3>

        <button class="profile-menu" onclick="viewOrders()">
            <span>📦</span>
            <span>My Orders<small>View your order history</small></span>
            <span class="arrow">›</span>
        </button>

        <button class="profile-menu" onclick="viewWishlist()">
            <span>♡</span>
            <span>My Wishlist<small>Products you saved</small></span>
            <span class="arrow">›</span>
        </button>
    </section>

    <section class="profile-section">
        <h3>Privacy & Security</h3>

        <button class="profile-menu" onclick="showPrivacy()">
            <span>🔒</span>
            <span>Privacy & Security<small>Account safety information</small></span>
            <span class="arrow">›</span>
        </button>
    </section>

    <button class="logout-button" onclick="logout()">
        Log Out
    </button>

    
    </form>
</div>

    <footer class="profile-footer">
        © 2026 SmartCart
    </footer>

</main>

<script src="profile.js"></script>
<script>
function logoutUser() {
    sessionStorage.removeItem("smartcartCustomer");
    sessionStorage.removeItem("smartcartSelectedProduct");
    sessionStorage.removeItem("smartcartPayment");

    alert("Logged out successfully!");

    window.location.replace("Login.html");
}
</script>
</body>
</html>
